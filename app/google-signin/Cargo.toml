[package]
name = "tauri-plugin-google-signin"
description = "In-app \"Sign in with Google\" for Code-Iot on Android (Credential Manager)"
version = "0.1.0"
edition = "2021"
license = "MIT"
links = "tauri-plugin-google-signin"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
