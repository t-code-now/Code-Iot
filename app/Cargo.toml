[package]
name = "codesprout-app"
description = "Android app shell for Code-Iot (Tauri)"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "codesprout_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
strip = true
