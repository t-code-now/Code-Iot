[workspace]
resolver = "2"
members = ["core", "server", "web"]
# The Android app has its own build (Tauri); see app/ and .github/workflows/android.yml.
exclude = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"

[profile.release]
opt-level = 3
lto = true

# Smaller WebAssembly bundle for the frontend.
[profile.release.package.codesprout-web]
opt-level = "z"
