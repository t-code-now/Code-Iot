# Render Blueprint: render.com → New → Blueprint → pick this repo.
services:
  - type: web
    name: code-iot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/courses
    autoDeploy: true
    envVars:
      - key: ADDR
        value: 0.0.0.0:10000
      - key: DATABASE_PATH
        value: /data/codesprout.db
      - key: RUST_LOG
        value: info
    # Free plan: the database resets when the server restarts or redeploys.
    # To keep data, switch plan to "starter" and uncomment:
    # disk:
    #   name: data
    #   mountPath: /data
    #   sizeGB: 1
