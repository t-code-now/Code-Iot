# Render Blueprint: render.com → New → Blueprint → pick this repo.
services:
  - type: web
    name: code-iot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/courses
    autoDeploy: true
    envVars:
      - key: ADDR
        value: 0.0.0.0:10000
      - key: DATABASE_PATH
        value: /data/codesprout.db
      - key: RUST_LOG
        value: info
      # Accounts and progress live in Turso (free), so they survive restarts.
      # Set both in the Render dashboard (Environment tab).
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
