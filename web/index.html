<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover" />
    <script>
      // Phones: if the browser ever shows this page zoomed out (smaller, like
      // the computer layout), set the viewport again so it snaps back to the
      // phone's own width, without the user having to refresh.
      // Chrome on a phone can reopen a tab in "Desktop site" mode (it keeps
      // that mode for pages it restores, even after the setting is off), and
      // then shows the site 980px wide. A reload asks again and gets the phone
      // layout, so reload once by ourselves (at most once per tab session, so a
      // user who really chose desktop mode is not stuck in a loop).
      (function () {
        try {
          var phone = navigator.maxTouchPoints > 0 && screen.width < 700;
          if (phone && window.innerWidth > screen.width * 1.5 && !sessionStorage.getItem('cs.mobile-reload')) {
            sessionStorage.setItem('cs.mobile-reload', '1');
            location.reload();
          }
        } catch (e) {}
      })();
      (function () {
        var vv = window.visualViewport;
        if (!vv) return;
        var busy = false;
        function fix() {
          var m = document.querySelector('meta[name="viewport"]');
          if (busy || !m || vv.scale >= 0.98) return;
          busy = true;
          var c = m.getAttribute('content');
          m.setAttribute('content', 'width=device-width');
          m.setAttribute('content', c);
          setTimeout(function () { busy = false; }, 800);
        }
        vv.addEventListener('resize', fix);
        window.addEventListener('load', function () { setTimeout(fix, 300); });
        window.addEventListener('pageshow', function () { setTimeout(fix, 300); });
      })();
    </script>
    <meta name="theme-color" content="#8FB4E6" />
    <title>Code-Iot</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800;900&family=Rubik:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link data-trunk rel="css" href="style/main.css" />
    <link data-trunk rel="copy-dir" href="assets" />
    <link data-trunk rel="rust" data-wasm-opt="z" />
  </head>
  <body></body>
</html>
